[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-helper"
version = "0.1.0"
description = "Shared-machine Harbor experiment CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "argon2-cffi>=23,<26",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "harbor==0.23.0",
    "httpx[socks]>=0.28.1",
    "python-multipart>=0.0.20,<1",
    "rich>=13,<16",
    "uvicorn>=0.34,<1",
]

[project.scripts]
harbor-helper = "harbor_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
