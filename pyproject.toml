[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-helper"
version = "0.1.0"
description = "Shared-machine Harbor experiment CLI"
requires-python = ">=3.12,<3.14"
dependencies = ["harbor==0.23.0", "httpx[socks]>=0.28.1"]

[project.scripts]
harbor-helper = "harbor_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
