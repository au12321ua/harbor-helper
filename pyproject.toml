[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-helper"
version = "0.2.0"
description = "Shared-machine Harbor experiment CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "argon2-cffi>=23,<26",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "harbor==0.23.0",
    "httpx[socks]>=0.28.1",
    "python-multipart>=0.0.20,<1",
    "rich>=13,<16",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
harbor-helper = "harbor_helper.commands.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "ty==0.0.89"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Domain suites import the support package under tests and verification tools under scripts.
pythonpath = ["tests", "scripts"]
addopts = "--strict-markers -m 'not browser'"
markers = ["browser: isolated production HTTP/static with actual Chromium subprocesses"]
