[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro"
version = "0.3.0.dev0"
description = "Team experiment service built on Harbor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<26",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "harbor==0.23.0",
    "httpx[socks]>=0.28.1",
    "python-multipart>=0.0.20,<1",
    "rich>=13,<16",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
maestro = "maestro.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maestro", "src/harbor_helper"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/maestro/db/migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
